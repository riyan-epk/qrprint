<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Print a document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="top">
      <div class="logo">🖨️</div>
      <div>
        <h1 id="shopName">Print Shop</h1>
        <p class="sub" id="shopSub">Scan · Upload · Pay · Print</p>
      </div>
    </header>

    <!-- Suspended notice -->
    <section id="lockedView" class="hidden banner banner-crit">
      <strong>Service paused</strong>
      <p id="lockedMsg">This shop is temporarily unavailable. Please try again later.</p>
    </section>

    <!-- Step 1: choose file -->
    <section id="uploadView">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.rtf,.txt,application/pdf,image/jpeg,image/png" hidden>
        <div class="dz-inner">
          <div class="dz-icon">📄</div>
          <div class="dz-title">Tap to choose a file</div>
          <div class="dz-hint" id="dzHint">PDF, Word, Excel, PowerPoint or image · up to <span id="maxMb">25</span> MB</div>
        </div>
      </label>
      <p class="err hidden" id="uploadErr"></p>
      <div class="uploading hidden" id="uploadingRow"><span class="spinner"></span> Reading your file…</div>
    </section>

    <!-- Step 2: options + price -->
    <section id="optionsView" class="hidden">
      <div class="filechip">
        <span class="fc-name" id="fcName">file.pdf</span>
        <span class="fc-meta" id="fcMeta">0 pages</span>
        <button class="fc-change" id="changeFile">Change</button>
      </div>

      <div class="opt">
        <label>Copies</label>
        <div class="stepper">
          <button id="copMinus" type="button">−</button>
          <input id="copies" type="number" value="1" min="1" max="999" inputmode="numeric">
          <button id="copPlus" type="button">+</button>
        </div>
      </div>

      <div class="opt" id="colorOpt">
        <label>Color</label>
        <div class="segmented" data-name="color">
          <button class="active" data-val="false" type="button">Black &amp; White</button>
          <button data-val="true" type="button">Color</button>
        </div>
      </div>

      <div class="opt" id="duplexOpt">
        <label>Sides</label>
        <div class="segmented" data-name="duplex">
          <button class="active" data-val="single" type="button">Single</button>
          <button data-val="double" type="button">Double</button>
          <button data-val="mixed" type="button">1st single, rest double</button>
        </div>
      </div>

      <div class="opt hidden" id="paperOpt">
        <label>Paper size</label>
        <div class="segmented" data-name="paperSize" id="paperSeg"></div>
      </div>

      <div class="opt">
        <label>Pages <span class="muted">(blank = all)</span></label>
        <input id="pageRange" class="text" type="text" placeholder="e.g. 1-3, 5, 8-10" inputmode="text">
      </div>

      <div class="pricebar">
        <div>
          <div class="price-label" id="priceDetail">—</div>
          <div class="price-amount"><span id="priceAmount">0</span> <small id="priceCur">PKR</small></div>
        </div>
        <button class="pay" id="payBtn">Pay &amp; Print</button>
      </div>
      <p class="err hidden" id="jobErr"></p>
    </section>

    <!-- Step 3: status -->
    <section id="statusView" class="hidden">
      <div class="status-icon" id="stIcon">⏳</div>
      <h2 id="stTitle">Working…</h2>
      <p class="sub" id="stMsg"></p>
      <div class="status-meta" id="stMeta"></div>
      <button class="secondary" id="againBtn">Print another</button>
    </section>

    <footer class="foot">Files are deleted right after printing.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
